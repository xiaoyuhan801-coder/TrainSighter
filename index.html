<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Train Info - UK</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;padding:16px}
h1{font-size:28px} .sub{color:#94a3b8}
input{width:100%;padding:13px;border-radius:10px;border:0;background:#1e293b;color:#fff;margin:8px 0;font-size:16px}
button{background:#f59e0b;color:#000;border:0;padding:13px;border-radius:10px;font-weight:800;width:100%;margin:6px 0}
.card{background:#1e293b;border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}
.card small{color:#94a3b8}.tag{display:inline-block;background:#334155;padding:4px 8px;border-radius:20px;font-size:12px}
.back{color:#f59e0b;cursor:pointer;font-weight:700}
</style></head>
<body><div id="app"></div>
<script>
let DB=JSON.parse(localStorage.getItem('traininfoUK')||'null')||[
{country:"🇬🇧 UK",railways:[
{name:"LNER",years:"1923-1948",formedFrom:"GNR + NER + GCR + GER + GNoSR + NBR + HBR",mergedInto:"British Railways (1948)",locos:[
{name:"Flying Scotsman",num:"4472 / 60103",year:"1923",info:"A3 Pacific, built Doncaster. First loco to officially do 100mph."},
{name:"Mallard",num:"4468 / 60022",year:"1938",info:"A4 Pacific. World steam speed record 126mph in 1938. Still holds it!"},
{name:"Sir Nigel Gresley",num:"4498 / 60007",year:"1937",info:"A4 Pacific. Still running on mainline."}
]},
{name:"GWR",years:"1835-1948",formedFrom:"Absorbed Cambrian, Taff Vale, Barry, Rhymney + many Welsh lines",mergedInto:"British Railways",locos:[]},
{name:"LMS",years:"1923-1948",formedFrom:"LNWR + Midland + Caledonian + Glasgow & South Western + Highland",mergedInto:"British Railways",locos:[]},
{name:"Southern Railway",years:"1923-1948",formedFrom:"LSWR + LBSCR + SECR",mergedInto:"British Railways",locos:[]},
{name:"British Railways",years:"1948-1997",formedFrom:"LNER + GWR + LMS + Southern",mergedInto:"Privatised",locos:[]},
{name:"GNoSR - Great North of Scotland",years:"1845-1923",formedFrom:"Independent",mergedInto:"LNER (1923)",locos:[]},
{name:"GNR - Great Northern",years:"1846-1923",formedFrom:"Independent",mergedInto:"LNER (1923)",locos:[]},
{name:"NER - North Eastern",years:"1854-1923",formedFrom:"York, Newcastle & Berwick + York & North Midland + Leeds Northern",mergedInto:"LNER (1923)",locos:[]},
{name:"GCR - Great Central",years:"1897-1923",formedFrom:"Manchester, Sheffield & Lincolnshire Railway",mergedInto:"LNER (1923)",locos:[]},
{name:"LNWR",years:"1846-1923",formedFrom:"Grand Junction + London & Birmingham + Manchester & Birmingham",mergedInto:"LMS (1923)",locos:[]},
{name:"Midland Railway",years:"1844-1923",formedFrom:"North Midland + Midland Counties + Birmingham & Derby",mergedInto:"LMS (1923)",locos:[]},
{name:"Caledonian Railway",years:"1845-1923",formedFrom:"Independent",mergedInto:"LMS (1923)",locos:[]},
]}
];
function save(){localStorage.setItem('traininfoUK',JSON.stringify(DB))}
let v={p:'home',ci:0,ri:0,li:0,q:''};
function render(){
let h='';
if(v.p=='home'){
h+=`<h1>🚆 Train Info</h1><div class=sub>🇬🇧 UK Edition - Start with LNER</div>
<input placeholder="🔍 Search engines..." value="${v.q}" oninput="v.q=this.value;search()"><div id=res></div>
<button onclick="addRailway()">+ ADD RAILWAY</button><button onclick="addCountry()">+ ADD COUNTRY (USA, Australia...)</button>`;
DB.forEach((c,ci)=>{h+=`<h2>${c.country}</h2>`;c.railways.forEach((r,ri)=>{h+=`<div class=card onclick="openRail(${ci},${ri})"><b>${r.name}</b><br><small>${r.years} • ${r.locos.length} locos</small><br><span class=tag>Joined into: ${r.mergedInto}</span></div>`})});
}else if(v.p=='rail'){
let r=DB[v.ci].railways[v.ri];
h+=`<div class=back onclick="v.p='home';render()">← Back</div><h1>${r.name}</h1><div class=sub>${r.years}</div>
<div class=card><b>Formed From:</b><br>${r.formedFrom}<br><br><b>Joined Into:</b><br>${r.mergedInto}</div>
<button onclick="addLoco()">+ ADD LOCOMOTIVE TO ${r.name}</button>`;
if(!r.locos.length)h+=`<p>No locos yet. Add the first one!</p>`;
r.locos.forEach((l,li)=>{h+=`<div class=card onclick="openLoco(${li})"><b>${l.name}</b> • ${l.num}<br><small>${l.year}</small></div>`});
}else{
let l=DB[v.ci].railways[v.ri].locos[v.li];let r=DB[v.ci].railways[v.ri];
h+=`<div class=back onclick="v.p='rail';render()">← Back to ${r.name}</div><h1>${l.name}</h1><div class=card><b>Number:</b> ${l.num}<br><b>Built:</b> ${l.year}<br><br>${l.info}</div><button onclick="delLoco()">Delete</button>`;
}
document.getElementById('app').innerHTML=h;
}
function search(){let q=v.q.toLowerCase(),el=document.getElementById('res');if(!q){el.innerHTML='';return}let o='';
DB.forEach((c,ci)=>c.railways.forEach((r,ri)=>r.locos.forEach((l,li)=>{if((l.name+l.num+l.info).toLowerCase().includes(q))o+=`<div class=card onclick="v.ci=${ci};v.ri=${ri};v.li=${li};v.p='loco';render()"><b>${l.name}</b> • ${r.name}</div>`})));
el.innerHTML=o||'No results - tap + ADD to add it!';}
function openRail(ci,ri){v.ci=ci;v.ri=ri;v.p='rail';render()}
function openLoco(li){v.li=li;v.p='loco';render()}
function addRailway(){let n=prompt('Railway name?');if(!n)return;let ff=prompt('Formed From?');let mi=prompt('Joined Into?');let y=prompt('Years?');let co=prompt('Country? Type UK for now, or new one like USA');let c=DB.find(x=>x.country.includes(co)||co.includes(x.country));if(!c){c={country:co,railways:[]};DB.push(c)}c.railways.push({name:n,years:y||'',formedFrom:ff||'',mergedInto:mi||'',locos:[]});save();render()}
function addCountry(){let co=prompt('New country? e.g. 🇺🇸 USA');if(co)DB.push({country:co,railways:[]});save();render()}
function addLoco(){let n=prompt('Loco name?');if(!n)return;DB[v.ci].railways[v.ri].locos.push({name:n,num:prompt('Number?')||'',year:prompt('Built year?')||'',info:prompt('Info?')||''});save();render()}
function delLoco(){if(confirm('Delete?')){DB[v.ci].railways[v.ri].locos.splice(v.li,1);save();v.p='rail';render()}}
render();
</script></body></html>
